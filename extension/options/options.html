<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css" />
  <link rel="stylesheet" href="../css/spectrum.css" />
  <script src="../js/jquery-3.1.1.min.js"></script>
  <script src="../js/moment.js"></script>
  <script src="../js/spectrum.js"></script>
  <script src="../common/ext-constants.js"></script>
  <script src="../common/classes.js"></script>
  <script src="../common/logging.js"></script>
  <script src="MiscOptions.js"></script>
</head>

<body>
  <div class="main-div">
    <h1>Archangel Options</h1>
    <div id="divScouting">
      <h3>
        Scouting Options
      </h3>
      <table>
        <tr>
          <th>Request Delay (seconds)</th>
          <td>
            <select id="optConnectionDelay" style="width: 35px">
              <option value="20000">30</option>
              <option value="15000">25</option>
              <option value="20000">20</option>
              <option value="15000">15</option>
              <option value="10000">10</option>
              <option value="9000">9</option>
              <option value="8000">8</option>
              <option value="7000">7</option>
              <option value="6000">6</option>
              <option value="5000">5</option>
              <option value="4000">4</option>
              <option value="3000">3</option>
              <option value="2000">2</option>
              <option value="1000">1</option>
            </select>
          </td>
        </tr>
      </table>
    </div>
    <div id="divColors">
      <h3>Color Options</h3>
      <table>
        <tr>
          <th>Text Based?</th>
          <td>
            <input id="TextBased" type="checkbox" />
          </td>
        <tr>
        <tr>
          <th>My Fleet</th>
          <td>
            <input id="MyLandedFleetColor" type="text" class="color"/>
          </td>
        </tr>
        <tr>
          <th>Fleet Not Yet Visible</th>
          <td>
            <input id="FleetNotVisibleColor" type="text" class="color" />
          </td>
        </tr>
        <tr>
          <th>Fleet Visible</th>
          <td>
            <input id="FleetVisibleColor" type="text" class="color" />
          </td>
        </tr>
        <tr>
          <th>Guild Fleet</th>
          <td>
            <input id="GuildFleetColor" type="text" class="color" />
          </td>
        </tr>
        <tr>
          <th colspan="2">
            <a href="#" id="btnUpdatePreferences" class="button">Update Preferences</a>
            <span class="notify"></span>
          </th>
        </tr>
      </table>
    </div>
  </div><!-- main div -->
</body>

</html>
