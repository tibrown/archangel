<!DOCTYPE html>

<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="MailRoom.css" />
  <script src="../js/jquery-3.1.1.min.js"></script>
  <script src="../js/moment.js"></script>
  <script src="../common/ext-constants.js"></script>
  <script src="../common/classes.js"></script>
  <script src="../common/ext-constants.js"></script>
  <script src="../common/logging.js"></script>
  <script src="../common/Mail.js"></script>
  <script src="MailRoom.js"></script>
</head>

<body>
  <div class="main-div">
    <table>
      <tr>
        <th>
          <span>Mail Room</span>
        </th>
      </tr>
      <tr>
        <td>
          <table>
            <tr>
              <th>
                <a href="#" id="btnWriteOne" class="menuSelect">Send PM</a>
              </th>
            </tr>
            <tr>
              <td>
                <div id="divSendOne" class="nodisplay">
                  <table>
                    <tr>
                      <th>Player ID</th>
                      <td>
                        <input type="text" id="OnePlayerId" class="FormReset"/>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="2">
                        <textarea id="txtOneMessage" rows="4" class="FormReset">Text</textarea>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="2">
                        <a href="#" id="btnSendOne" class="menuSelect">Send</a>
                      </td>
                    </tr>
                  </table>
                </div>
              </td>
            </tr>
            <tr>
              <th>
                <a href="#" id="btnSendGuild" class="menuItem">Send to Entire Guild</a>
              </th>
            </tr>
            <tr>
              <td>
                <div id="divGuildMembers"  class="nodisplay">
                  <table>
                    <tr>
                      <td>
                        <textarea id="txtGuildMessage" rows="4" class="FormReset">Text</textarea>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <a href="#" id="btnSendToGuild" class="menuSelect">Send</a>
                      </td>
                    </tr>
                    <tr>
                      <th>Select All? <input type="checkbox" id="inpSelAll"/></th>
                    </tr>
                    <tr>
                      <td>
                        <table>
                          <tr>
                            <td>
                              <table id="MembersOdd" class="MembersTable">
                                <tr>
                                  <th>Player</th>
                                  <th>Player ID</th>
                                </tr>
                              </table>
                            </td>

                            <td>
                              <table id="MembersEven" class="MembersTable">
                                <tr>
                                  <th>Player</th>
                                  <th>Player ID</th>
                                </tr>
                              </table>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
